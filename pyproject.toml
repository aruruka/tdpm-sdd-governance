[project]
name = "tdpm-sdd-governance"
version = "1.0.0"
description = "Unified Technical Director / Product Manager (TD/PM) and Stage-Gated Spec-Driven Development (SDD) Governance Engine for Google Antigravity"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Raymond Yan", email = "keraymondyan69@gmail.com" },
]
keywords = [
    "antigravity",
    "sdd",
    "bdd",
    "ddd",
    "governance",
    "cqrs",
    "event-sourcing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12.20240917",
]

[project.urls]
Homepage = "https://aruruka.github.io/tdpm-sdd-governance/"
Repository = "https://github.com/aruruka/tdpm-sdd-governance"

[project.scripts]
tdpm-sdd = "tdpm_sdd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdpm_sdd"]
